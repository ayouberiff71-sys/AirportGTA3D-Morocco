
name: Build Airport GTA3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: |
          unzip -q AirportGTA3D_Morocco_v12_StartButton_Fix.zip -d project
      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> project/AirportGTA3D_Android/gradle.properties
      - name: Build APK
        run: |
          cd project/AirportGTA3D_Android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AirportGTA3D-debug-apk
          path: project/AirportGTA3D_Android/app/build/outputs/apk/debug/app-debug.apk
          
